universe:
  exchanges: [N, Q, A]              # nasdaqtrader: N=NYSE, Q=Nasdaq, A=NYSE American
  min_market_cap: 300000000
  min_avg_dollar_volume: null       # Phase 1 미작동 — 설계문서 §5.3
  exclude_financial_status: [D, E, Q]
  exclude_sic: ["6770"]
  security_name_include: ["Common Stock", "Ordinary Shares"]
  security_name_exclude:
    [Preferred, Warrant, Unit, Right, Depositary, "% Note", "Trust Preferred"]

ingest:
  bulk_quarters: 8
  sec_user_agent: "TenbaggerDashboard/0.1 (kk910519@gmail.com)"
  sec_rate_limit_per_sec: 10
  finnhub_rate_limit_per_sec: 1     # 무료 티어 분당 60회
  cache_dir: "./data/cache"
  # 정규화 실패율이 이 비율을 넘으면(그리고 표본이 충분하면) 잡 전체를 failed로
  # 기록한다 — 개별 회사의 데이터 결함이 아니라 정규화 로직/스키마 전반의
  # 문제일 가능성이 높다는 신호. 근거는 task-11-report.md 참고.
  normalize_failure_rate_threshold: 0.5
  normalize_failure_min_sample: 20
  # 저장된 financial_facts 행 수가 이 값보다 적으면 filed_date가 최신이어도(즉
  # selectStaleCiks가 최신으로 판단해도) API 재조회 대상에 넣는다 — 자가치유 가드.
  # 근거는 companyfacts-cik-report.md: API 소스 사실이 0건인 180개 회사는 fact_count
  # 평균 149·최댓값 391인 반면, API 소스가 있는 999개 회사는 평균 876·최솟값 127이고
  # 200 미만은 0.1%(1개)뿐이다. 200은 문제 코호트의 83%를 잡아내면서 이미 정상인
  # 회사를 잘못 재조회에 넣는 비율은 0.1%로 억제한다.
  thin_coverage_min_facts: 200

classification:
  leader_ratio_of_max: 0.25
  leader_max: 5
  leader_min: 2
  leader_min_industry_candidates: 3
  challenger_min_market_cap: 2000000000
  emerging_max_market_cap: 5000000000
  emerging_revenue_threshold: 500000000

staleness:
  price_days: 5
  financials_days: 120
  scores_days: 14
  tam_days: 400

scoring:
  min_completeness: 0.6
  wacc_assumption: 0.09
  tax_rate: 0.21
  min_industry_candidates: 3
  # ROIC 분모(투하자본 = 총부채 + 자본 − 현금)가 "그 자체를 이루는 총액"에서 차지해야 하는
  # 최소 비중. 0 이하만 걸러내면 +$1도 정상 분모로 인정된다 — 자사주 매입으로 자본이 음수인
  # 기업의 투하자본은 큰 수들이 상쇄되고 남은 잔차라서, ROIC가 사업의 자본생산성이 아니라
  # 자본구조의 산물이 된다(DBX 2025: 부채 2,834M + 자본 −1,797M − 현금 891M = 145M → ROIC
  # 374%). 총액을 |총부채| + |자본| + |현금|으로 잡아 부호가 아니라 상쇄의 정도를 본다.
  #   0.10 = 잔차가 총액의 10% 미만이면 ROIC를 정의하지 않는다(NOT_APPLICABLE).
  # 이 값은 Tenbagger의 competitive_advantage와 valuation의 Moat Signal이 함께 읽는다.
  #
  # **분모가 답을 바꿀 수 있을 때만 적용된다.** Moat Signal이 각 기간에 묻는 것은
  # "ROIC가 자본비용을 넘었는가"라는 부호 질문이고, NOPAT이 0 이하면 그 답은 분모의
  # 크기와 무관하게 이미 "아니오"다(투하자본이 양수인 한 ROIC ≤ 0 < WACC). 그런 기간을
  # 이 하한으로 버리면 **회사에 대한 결론**을 **우리에 대한 진술**로 바꾸는 것이고
  # (50개 기업이 ABSENT → INSUFFICIENT_DATA로 갔는데 그중 48개는 버려진 기간이 전부
  # 영업적자였다), 더 나쁘게는 **불리한 증거만 지워 등급을 올릴 수 있다**(SEZL:
  # 영업적자 2개 기간만 빠져 3/6 = 0.500 → 3/4 = 0.750으로 최상위 등급). 그래서 하한은
  # NOPAT > 0인 기간 — 즉 잔차 분모가 실제로 "ROIC 520%"를 만들어내는 쪽 — 에만 건다.
  # 결과적으로 이 하한은 상회 기간만 제거할 수 있으므로 등급을 낮추거나 유지할 뿐
  # 절대 올리지 못한다. 부작용으로 문턱 민감도도 줄어든다: 하한이 실제로 판정을 가르는
  # 기간이 6,198개 중 2,281개(NOPAT > 0)로 좁아진다.
  # competitive_advantage의 roic_spread는 부호가 아니라 **크기**를 묻는 신호이므로
  # 예전 그대로 roic()를 쓴다 — 잔차 분모가 만든 520%는 그 신호에 넣을 수 없다.
  min_invested_capital_ratio: 0.10
  # 매출 규모 감쇠 — revenue_growth·revenue_acceleration·operating_leverage 세 팩터에 곱한다.
  # 매출 200만이 2000만이 되면 성장률 900%지만 그 증가분은 사업 확장이 아니라
  # 마일스톤·협업 수령액인 경우가 많다. 즉 매출 기반이 극히 작으면 성장 "율"이
  # 정보를 잃는다. 하한선으로 잘라내지 않고(진짜 초기 유망 기업까지 사라진다)
  # 배수로 줄인다.
  #
  # **곡선이 보는 것은 비율의 분모가 된 기간이다.** 예전에는 최신 TTM 매출을 봤는데,
  # 위험한 것은 비율이 도달한 수준이 아니라 비율이 나눈 기저다. SEPN은 TTM 매출이
  # $726K → $98.88M이 되어 최신 매출로는 감쇠 구간 밖($98.9M)이지만, +13,520%라는
  # 성장률의 분모는 $726K다. 그래서 각 팩터는 **자기 비율의 분모가 된 기간**을 넘긴다:
  #   · revenue_growth       → 1년 전 TTM 매출 (TTM YoY의 분모)
  #   · revenue_acceleration → 1년 전 4개 분기 매출 합계 (네 개 YoY의 분모 전부)
  #   · operating_leverage   → 1년 전 TTM 매출 (기저 영업이익률의 분모)
  # 기저와 현재 중 **감쇠가 더 센 쪽**(배수가 작은 쪽)을 채택한다. 비율은 두 수에 대한
  # 진술이므로 어느 한쪽이라도 잡음 구간에 있으면 비율은 정보를 잃는다. 곡선이 매출에
  # 대해 단조 증가하므로 성장률이 0 이상인 회사에서는 기저 ≤ 현재라 이 규칙은 곧
  # "기저를 본다"와 같고, 두 값이 갈리는 것은 매출이 줄어든 회사뿐이다 — 그 회사들은
  # 이미 성장 곡선 바닥이라 순위가 움직이지 않는다. 부수 효과로 이 변경은 어떤 회사의
  # 점수도 **올리지 못한다**(min ≤ 예전 값): 새 상위권을 만들어내지 않는다.
  #
  # x = TTM 매출(USD), y = 성장 팩터에 남는 비율.
  #   50M  → 1.00: 상위 100의 최대 구간(50M~500M, 42개)은 의도대로 작동하는 부분이므로
  #                감쇠 없이 통과시킨다. 이 지점 이상은 이 변경의 영향을 받지 않는다.
  #   10M  → 0.55: market_cap_opportunity.gate.zero_if_revenue_below와 같은 지점.
  #                제품이 이미 "이 밑은 매출 기반으로 인정하지 않는다"고 선언한 값이다.
  #   5M~  → 0.40: 바닥. 0이 아니다 — 나머지 65점으로 진짜 폭발적인 초소형주가
  #                여전히 올라올 수 있어야 한다.
  # market_cap_opportunity는 작은 시총에 높은 점수를 주는 것이 의도된 설계이며
  # 이 감쇠의 대상이 아니다.
  revenue_scale_damping:
    curve: [[5000000, 0.40], [10000000, 0.55], [20000000, 0.70], [35000000, 0.85], [50000000, 1.00]]
  # 화면 표기 한계 — 점수가 아니라 "이 숫자를 그대로 읽을 수 있는가"의 경계다.
  # 한계를 넘으면 숫자를 깎거나 감추지 않고, **그 비율을 만든 두 값**을 대신 적는다
  # (예: "TTM 매출 +13520.1%" → "TTM 매출 $726K → $98.9M (136배)"). 다섯 자리 퍼센트는
  # 정보가 아니라 경보이고, 기저를 보여주면 읽는 사람이 스스로 판단할 수 있다.
  extreme_display:
    # 성장률·가속도(비율 단위). +1000%는 매출이 11배가 됐다는 뜻으로, 이 위로는
    # 퍼센트 자릿수가 늘어날 뿐 성장의 차이를 읽을 수 없다.
    growth_ratio: 10.0
    # 영업이익률 변화(%p). 마진 변화가 100%p를 넘으려면 어느 한 기간의 영업손실이
    # 그 기간 매출보다 커야 한다 — 즉 이 한계를 넘는다는 사실 자체가 "분모가 된 매출이
    # 손실 규모에 비해 미미했다"는 진술이다. 임의로 고른 값이 아니라 마진이라는 지표가
    # 자기 정의로 갖는 경계다.
    margin_delta_points: 100.0
  factors:
    revenue_growth:
      weight: 20
      blend: { ttm_yoy: 0.6, cagr_3y: 0.4 }
      curve: [[-0.10, 0.00], [0.00, 0.10], [0.15, 0.35], [0.25, 0.60], [0.40, 0.85], [0.60, 1.00]]
    revenue_acceleration:
      weight: 10
      curve: [[-0.20, 0.00], [-0.05, 0.25], [0.00, 0.45], [0.05, 0.70], [0.15, 0.90], [0.30, 1.00]]
    tam_industry_growth:
      weight: 15
      blend: { tam_cagr: 0.6, penetration: 0.4 }
      cagr_curve: [[0.00, 0.00], [0.05, 0.25], [0.10, 0.55], [0.15, 0.80], [0.25, 1.00]]
      penetration_curve: [[0.00, 1.00], [0.05, 1.00], [0.15, 0.80], [0.30, 0.50], [0.50, 0.20], [1.00, 0.00]]
    gross_margin:
      weight: 10
      blend: { level: 0.6, trend: 0.4 }
      level_curve: [[0.10, 0.00], [0.25, 0.25], [0.40, 0.50], [0.55, 0.75], [0.70, 0.95], [0.85, 1.00]]
      trend_curve: [[-500, 0.00], [-100, 0.30], [0, 0.50], [100, 0.70], [300, 0.90], [600, 1.00]]
    operating_leverage:
      weight: 10
      blend: { margin_delta: 0.5, growth_gap: 0.5 }
      margin_delta_curve: [[-5, 0.00], [-1, 0.30], [0, 0.50], [2, 0.75], [5, 0.95], [10, 1.00]]
      growth_gap_curve: [[-0.10, 0.00], [-0.02, 0.30], [0, 0.50], [0.05, 0.75], [0.12, 0.95], [0.25, 1.00]]
    market_cap_opportunity:
      weight: 15
      bands:
        - { max: 1000000000, points: 15 }
        - { max: 3000000000, points: 14 }
        - { max: 10000000000, points: 12 }
        - { max: 30000000000, points: 8 }
        - { max: 100000000000, points: 4 }
        - { max: null, points: 1 }
      gate:
        zero_if_revenue_growth_below: 0.0
        zero_if_revenue_below: 10000000
        warning_multiplier: 0.5
        # 최신 TTM 구간의 매출이 null일 때, "이 회사의 매출 규모"를 묻는 게이트 조건에
        # 쓸 대체 관측치를 찾는 범위(최근 구간 수). 최신 TTM만 보고 NO_DATA로 돌리면
        # **매출을 보고하지 않은 회사**와 **우리가 TTM 매출을 유도하지 못한 회사**를
        # 구분하지 못한다: 274개 NO_DATA 중 31개는 최근 4개 TTM 구간 중 하나에 매출이
        # 있고(VICR: 2025-09-30에 $738.9M, 이후 null), 58개는 최신 연간 기간에 매출이
        # 있다(XEL: 연 $11.686B인데 TTM 매출은 전 구간 null). 그 사실을 확보하고 있는데도
        # "모른다"고 말할 이유가 없다. 같은 범위를 TTM → 연간 순으로 훑고, 대체값을
        # 쓴 경우 어느 기간에서 가져왔는지 detail에 남긴다. 게이트의 성장률 조건은
        # 대체하지 않는다 — 성장률은 규모와 달리 한 시점의 값이 아니라 두 시점의 차이이고,
        # 서로 다른 기간 종류를 섞으면 그 차이가 회사가 아니라 기간 정의를 재게 된다.
        revenue_fallback_periods: 4
    competitive_advantage:
      weight: 10
      # 신호가 1개뿐이면 채점하지 않고 NO_DATA로 둔다. 증거 1개짜리 만점(예: 임상단계
      # 제약사의 R&D 집약도 +145%)이 4개를 다 채운 기업을 앞지르는 것을 막는다.
      # 전체 점수는 SCORED 가중치로만 정규화되므로(설계문서 §8.1) 빠져도 왜곡되지 않는다.
      min_signals: 2
      # x = 계산된 신호 수 / "그 회사에 대해 평가 가능했어야 할 신호 수".
      # 분모에는 회사 사유로 빠진 신호만 넣는다. 산업 후보 부족(우리 taxonomy가 얇다는
      # 뜻이지 회사의 결함이 아니다)으로 "산업 대비 마진"이 빠지면 분모는 3이 되고,
      # 나머지 3개를 다 계산했다면 감쇠 없이 만점이 가능하다.
      # 항등 곡선 = 커버리지 비율 그대로 감쇠. 리밸런싱은 코드가 아니라 이 곡선에서 한다.
      coverage_curve: [[0.50, 0.50], [0.75, 0.75], [1.00, 1.00]]
      signals:
        roic_spread: [[-0.10, 0.00], [0.00, 0.35], [0.05, 0.60], [0.15, 0.85], [0.30, 1.00]]
        gm_stability: [[0.70, 0.00], [0.85, 0.35], [0.92, 0.65], [0.96, 0.90], [0.99, 1.00]]
        gm_vs_industry: [[-0.20, 0.00], [-0.05, 0.30], [0.00, 0.50], [0.10, 0.80], [0.25, 1.00]]
        rd_intensity: [[0.00, 0.00], [0.03, 0.25], [0.08, 0.55], [0.15, 0.85], [0.25, 1.00]]
    balance_sheet:
      weight: 5
      # competitive_advantage와 같은 규칙이다: 계산된 신호만 평균 내면 "증거가 적을수록
      # 점수가 높아진다". debt_to_ebitda는 영업이익이 0 이하면 null이므로 레버리지 신호가
      # 빠지는 조건은 곧 "그 회사가 영업 적자"라는 회사 쪽 사실이다 — 분모에서 빼주면
      # 적자라는 이유로 감점을 면제받는다(CLFD: 영업손실 −$0.4M인데 5/5 만점).
      # min_signals: 1 — 순현금 하나만으로도 채점은 하되 커버리지로 감쇠한다. 순현금
      # 포지션 자체는 진짜 정보이므로 NO_DATA로 지우지 않는다.
      min_signals: 1
      # x = **계산된 신호의 blend 가중치 합** / "평가 가능했어야 할 신호의 가중치 합".
      # 분모에는 회사 사유(현금·부채·영업이익 결측 또는 영업 적자)로 빠진 신호만 넣는다.
      # 시가총액이 없어서 순현금 비율을 못 구하는 경우는 우리 시세 데이터 쪽 사정이므로
      # 분모에서 제외한다(competitive_advantage의 taxonomy 예외와 같은 취급).
      #
      # 커버리지를 **개수가 아니라 가중치로** 세는 이유: 이 팩터는 두 신호를 0.6/0.4로
      # 섞는데 커버리지만 개수로 세면 `mean × coverage`가 "빠진 신호 = 최악(0점)"과
      # 같아지지 않는다. 순현금이 빠지면 0.5·l이 되어, 순현금 비율 a가 l/6보다 작은
      # 기업은 **현금을 보고하지 않은 편이 점수가 높아진다**(GEN 실사례, 현금을 보고한
      # 223개 중 7개가 이 구간에 있었다). 가중치로 세면 mean × coverage가
      # `Σ wᵢ·sᵢ / Σ w(평가 가능)`로 정확히 접히므로 빠진 신호는 항상 0점과 같아진다 —
      # competitive_advantage·uncertainty가 이미 만족하는 단조성을 이 팩터도 갖는다.
      # 곡선이 항등이어야 그 접힘이 성립하므로 [[0.50,0.50],...]의 하단 클램프를 없앴다
      # (도달 가능한 커버리지 0.4에서 클램프가 0.5로 올려 단조성을 다시 깨뜨렸다).
      coverage_curve: [[0.00, 0.00], [1.00, 1.00]]
      profitable_blend: { net_cash: 0.6, leverage: 0.4 }
      net_cash_curve: [[-0.50, 0.00], [-0.20, 0.25], [0.00, 0.50], [0.10, 0.75], [0.25, 1.00]]
      leverage_curve: [[0, 1.00], [1, 0.85], [2, 0.60], [4, 0.30], [6, 0.00]]
      runway_curve: [[2, 0.00], [4, 0.20], [8, 0.50], [12, 0.80], [20, 1.00]]
    institutional_insider:
      weight: 5
      implemented: false

quality_gate:
  revenue_decline_years: 2
  extreme_dilution: 0.50
  dilution_warning: 0.15
  gm_collapse_bps: 500
  sbc_of_revenue: 0.25
  debt_to_ebitda: 5
  runway_critical_quarters: 2
  runway_low_quarters: 6

# Fair Value 엔진(src/engines/valuation) 설정. wacc_assumption·tax_rate는 scoring에서 재사용한다.
valuation:
  projection_years: 5
  terminal_growth_rate: 0.025       # 장기 명목 GDP 성장률에 근접한 값 — scoring.wacc_assumption(0.09)보다 반드시 작아야 함
  # 명시적 예측이 **실제로 주장하는 결과**의 상한 — 페이드 스케줄을 그대로 태웠을 때
  # projection_years 뒤 매출이 지금의 몇 배가 되는가. 이 값을 넘으면 숫자를 내지 않고
  # INSUFFICIENT_DATA(GROWTH_NOT_PROJECTABLE)로 돌린다 — 상한값으로 깎아서 계산하지
  # 않는다. 깎는 것은 "측정하지 못한 값을 우리가 지어내는" 일이고, 이 엔진의 다섯 게이트가
  # 이미 거부하는 방식이다(설계 원칙: 근거가 없으면 숫자가 아니라 그렇게 말한다).
  #
  # 왜 성장'률'이 아니라 배수인가: 엔진은 초기 성장률을 터미널 성장률로 페이드시키므로,
  # 같은 초기 성장률이라도 fade_curve·projection_years·terminal_growth_rate가 달라지면
  # 결과는 크게 달라진다. 초기 성장률 상한은 그 차이를 보지 못하는 대리 지표이고, 배수는
  # 투영이 화면에 대고 주장하는 바로 그 값이다. 위 세 설정을 바꿔도 이 상한은 계속
  # 같은 것을 막는다.
  #
  # 왜 상한이 필요한가: CRMD의 TTM YoY +385%는 5년 뒤 매출을 63.41배로 만들고, 시총
  # $588M 기업의 내재가치를 주당 $545.63(안전마진 98.6% "저평가")으로 계산했다.
  # 이것은 측정이 아니라 저작(authorship)이다.
  #
  # 왜 3.00배인가 (성숙마진 앵커 도입 후 재유도):
  #   · 규칙을 한 문장으로 말할 수 있다 — "예측 구간 안에서 매출이 세 배를 넘게 불어난다고
  #     전제하지 않는다".
  #   · 지금까지 쓰던 초기 성장률 상한 0.60(scoring.factors.revenue_growth.curve가 1.00으로
  #     포화하는 지점 = "이 위로는 성장률의 차이가 더 이상 정보를 갖지 않는다")을 이 페이드
  #     스케줄에 태우면 정확히 2.9835배다. 즉 같은 경계를, 투영이 실제로 주장하는 단위로
  #     다시 쓴 값이다. **이 근거는 마진과 무관하므로 그대로 남는다.**
  #   · **SMCI 근거는 철회한다.** "3.10배인 SMCI조차 주당 $277.51을 낸다"는 관측은 배수가
  #     아니라 전역 성숙마진 15%가 만든 값이었다(검증 리뷰 Part 2). 성숙마진을 SMCI가 실제로
  #     보여준 3.63%에 앵커하면 같은 3.10배에서 주당 $68.49가 나온다 — 4.1배 작고, 리뷰가
  #     "정직한 값"으로 계산한 $67.97과 사실상 같다. 즉 그 측정은 이 상한을 지지하지 않는다.
  #   · 재측정: 이 상한이 거부하던 15개 중 **12개는 이제 마진 앵커가 독립적으로 거부한다**
  #     (더 근본적인 사유로 — CRMD의 최근 7개 연간 FCF마진 중앙값은 −55.3%다). 상한만이
  #     거부하는 기업은 SMCI(3.10배)·NVDA(4.40배)·MU(7.24배) 셋뿐이고, 상한을 무한대로
  #     열어도 값을 얻는 기업은 199 → 202로 3개 늘 뿐이다. 즉 이 게이트는 병리의 주 필터에서
  #     **성장 쪽만 보는 좁은 가드**로 축소됐다 — 그래도 남겨 둔다: 마진 앵커는 마진에 대한
  #     증거일 뿐 성장 지속성에 대한 증거가 아니다.
  #   · NVDA를 값 내지 않는 이유(4.40배): 마진 앵커를 적용하면 NVDA의 성숙마진은 모델
  #     전체에서 가장 잘 측정된 입력이 된다(연간 5개 기간 FCF마진 중앙값 44.35%, 산포 0.05).
  #     그래서 남은 유일한 미측정 입력이 "5년 안에 매출이 4.40배가 된다"는 성장 가정이고,
  #     그 위에서 나올 판정(주당 $266.89 대 주가 $223.96 → UNDERVALUED)은 전적으로 그
  #     가정이 낸 결론이다. 상한을 4.40배 위로 올릴 근거는 마진 쪽에서 나오지 않는다.
  #   · scoring.revenue_scale_damping(매출 규모 감쇠) 곡선은 여기에 맞지 않는다: 그것은
  #     "매출 기반이 작아서 비율이 의미를 잃는 경우"를 다루는데, CRMD의 TTM 매출은 $400M로
  #     감쇠 구간(≤$50M) 밖이다. 문제는 매출 규모가 아니라 복리 투영 자체다.
  #
  # 이 상한은 옛 max_projectable_growth를 포섭한다: 페이드가 고정된 상태에서 암시 배수는
  # 초기 성장률의 순증가 함수이므로 모든 성장률 상한은 배수 상한으로 옮겨 적을 수 있지만,
  # 그 역은 성립하지 않는다(페이드를 바꾸면 같은 성장률 상한이 다른 결과를 허용한다).
  # 그래서 둘을 함께 두지 않고 성장률 상한은 제거했다.
  max_implied_revenue_multiple: 3.00
  # x=예측 연차(1..projection_years), y=초기값(성장률/FCF마진)에 남는 가중치.
  # y=1: 초기 추정치 그대로, y=0: 터미널 성장률/성숙 마진으로 완전 수렴.
  # projection_years년째에 0에 도달해 명시적 예측과 터미널가치 사이에 불연속이 생기지 않게 한다.
  fade_curve: [[0, 1.00], [1, 0.80], [2, 0.60], [3, 0.40], [4, 0.20], [5, 0.00]]
  # 성숙 FCF마진 — **회사마다 다르다.** 전역 상수 0.15를 모든 기업에 똑같이 적용하던
  # 것을 각 기업이 실제로 보여준 마진에 앵커한다.
  #
  # 왜 바꿨는가: fade_curve가 projection_years에서 0에 도달하므로 최종연도 FCF는 정의상
  # `매출₅ × 성숙마진`이고, 그 위에 선 터미널가치가 기업가치의 약 75%(중앙값)를 차지한다.
  # 성숙마진이 전역 상수면 터미널 블록의 유일한 회사별 입력은 매출뿐이므로, DCF는 사실상
  # "매출 × 2.7배 + 순현금"이 된다. 그 결과 P/FV가 **회사의 현재 마진과 상관**을 갖는다
  # (스피어만 ρ = +0.394, 마진 구간별 중앙 P/FV 0.49 → 0.95 → 1.57 → 1.69). 즉 모델은
  # 값이 싼지를 재는 것이 아니라 각 회사의 마진이 15%에서 얼마나 떨어져 있는지를 쟀다.
  # SMCI(영업이익률 4.5%)의 주당 $277.51도, XRX(마진 2.1%)의 $166.91도 성장이 아니라
  # 이 가정이 만든 값이다.
  #
  # 무엇으로 대체하는가: 최근 lookback_periods개 **연간** 기간에서 관측된 마진의
  # **중앙값**. 연간을 쓰는 이유는 해자 판정과 같다 — TTM은 분기마다 겹쳐서 "몇 개의
  # 뚜렷한 해"를 셌다고 말할 수 없다. 평균이 아니라 중앙값인 이유는 한 해의 대규모
  # 일회성 항목이 영구 가정을 통째로 옮기면 안 되기 때문이다.
  #
  # 어떤 마진인가: **초기 마진과 같은 기준으로 잰다.** 초기 마진이 실제 FCF마진이면
  # FCF마진 이력을, nopat_proxy(영업이익률 × (1 − 세율))면 NOPAT마진 이력을 본다.
  # 페이드는 초기값에서 성숙값으로 수렴하는 경로이므로, 그 양 끝이 서로 다른 측정이면
  # 페이드 자체가 측정이 아니라 두 지표의 혼합이 된다.
  #
  # 왜 전역 prior에 수축(shrink)시키지 않는가: 상수를 섞는 비중 w를 0 → 1로 올리면
  # ρ가 −0.197 → −0.067 → −0.017(w=0.25) → +0.138 → +0.281 → +0.392로 **단조롭게**
  # 되돌아온다. 즉 상관을 만들던 것이 바로 그 상수이며, w를 골라 ρ를 0에 맞추는 것은
  # 원하는 숫자에 맞춰 가정을 고르는 일(튜닝)이다. w = 0 — 성숙마진은 그 회사가 보여준
  # 값이고, 남는 상관은 우리가 고른 상수가 아니라 시장의 성질이다.
  mature_margin:
    lookback_periods: 8             # 최근 연간 8개 기간(최대)까지만 본다 — moat.lookback_periods와 같은 창
    min_periods: 4                  # 마진을 관측한 연간 기간이 이보다 적으면 산출하지 않는다(MARGIN_NOT_ANCHORABLE)
    # 산포 상한 = median(|xᵢ − median|) / median. **1.00은 튜닝된 값이 아니라 항등점**이다:
    # 흩어짐이 수준 자체와 같아지는 지점, 즉 "이 회사의 마진은 하나의 수준이라기보다
    # 흩어짐"이라고 말해야 하는 경계다. 이 문턱을 0.5 ~ ∞로 움직여도 ρ는 −0.209 ~ −0.230
    # 사이에서 거의 움직이지 않는다 — 즉 이 값은 상관을 조정하는 손잡이가 아니라
    # 순수한 거부 규칙이다. 중앙값이 0 이하인 기업(현재 59개)도 함께 거부한다: 8년 중
    # 절반 이상 현금을 만들지 못한 회사에 영구 양(+)의 마진을 부여하는 것은 측정이 아니다.
    max_dispersion: 1.00
  price_to_fair_value:
    undervalued_max_ratio: 0.85     # price/fair_value ≤ 0.85 → UNDERVALUED
    overvalued_min_ratio: 1.15      # price/fair_value ≥ 1.15 → OVERVALUED
  moat:
    lookback_periods: 8             # 최근 연간 8개 기간(최대)까지만 본다
    min_periods_required: 4         # ROIC 산출 가능 기간이 4개 미만이면 INSUFFICIENT_DATA
    # 등급 이름은 Morningstar의 published tier 어휘(Wide/Narrow/None)를 쓰지 않는다.
    # 측정하는 것이 "초과수익의 지속성"뿐이므로 이름도 그 사실만 말한다. 임계값은 불변.
    persistent_clear_ratio: 0.75    # 유효 기간의 75% 이상에서 ROIC>WACC → PERSISTENT
    intermittent_clear_ratio: 0.40  # 40~75% → INTERMITTENT, 그 미만은 ABSENT(측정했고 없었다)
  uncertainty:
    growth_lookback_quarters: 8     # 매출 YoY·영업이익률 변동성 계산에 쓰는 최근 TTM 구간 수
    min_periods: 4                  # 이 미만이면 해당 드라이버는 UNAVAILABLE
    # x = 측정된 드라이버 수 / "그 회사에 대해 측정 가능했어야 할 드라이버 수",
    # y = 측정된 위험 평균에 주는 가중치. 나머지 (1−y)는 최대 위험(1.0)으로 채운다.
    #
    # competitive_advantage의 커버리지 감쇠와 같은 규칙을 부호만 뒤집어 적용한 것이다.
    # 거기서는 계산 못 한 신호를 0점(최악)으로 취급해 mean × coverage로 깎았고, 여기서는
    # 측정 못 한 드라이버를 위험 1.0(최악)으로 취급한다 — 불확실성은 "이 회사를 얼마나
    # 믿을 수 있는가"의 척도이므로, 이력이 없어서 측정하지 못했다는 사실 자체가 낮은
    # 확신의 근거다. 이것은 결측을 중립값으로 메우는 것이 아니라, 이 엔진이 이미 명시해 둔
    # "판단 불가 = 최고 위험" 규칙(측정 0개 → 1.0)을 부분 결측까지 연속적으로 확장한 것이다.
    #
    # 분모에서 빼는 것: business_concentration(10-K 텍스트 파싱 미구현 — 우리 쪽 사정이고
    # 모든 회사에 동일하다). 나머지 셋은 회사 사유다 — 이력이 짧다·부채나 영업이익이 없다는
    # 것은 그 회사의 사실이다.
    # 항등 곡선. 리밸런싱은 코드가 아니라 이 곡선에서 한다.
    coverage_curve: [[0.00, 0.00], [1.00, 1.00]]
    revenue_predictability_curve: [[0.00, 0.00], [0.08, 0.20], [0.15, 0.45], [0.30, 0.75], [0.50, 1.00]]
    operating_margin_volatility_curve: [[0.00, 0.00], [0.02, 0.20], [0.05, 0.45], [0.10, 0.75], [0.20, 1.00]]
    data_completeness_curve: [[0.00, 1.00], [0.50, 0.75], [0.70, 0.45], [0.85, 0.20], [1.00, 0.00]]
    # MINIMAL → MODERATE → ELEVATED → SEVERE. Morningstar의 published tier 어휘
    # (Low/Medium/High/Very High/Extreme)를 쓰지 않는다. 경계값은 불변이다.
    level_thresholds: { moderate: 0.25, elevated: 0.50, severe: 0.75 }
