# 여기 없는 SIC는 유니버스에서 제외된다.
# 겹치는 SIC는 가장 지배적인 하나로 배정하고 예외는 company-overrides.yaml이 처리한다.
#
# --- 2026-08-15 잔여(residual) SIC 규칙 ---
# SEC 공식 설명이 "나머지 전부"를 뜻하는 코드 — NEC / Not Elsewhere Classified /
# Miscellaneous·Misc / "…, Etc." — 이거나 2자리 대분류 헤더(xx00)인 SIC는 **업종이 아니라
# 범위**를 가리킨다. 그런 코드를 특정 성장 산업 하나에 매핑하면 그 산업의 중앙값
# (tam_industry_growth의 대체값, competitive_advantage의 산업 대비 마진)이 무관한 회사들로
# 만들어진다. 그래서 잔여 SIC는 **매핑하지 않는 것이 기본값**이고, 아래 residual_reviewed에
# 실제 등록기업(filer) 증거와 함께 명시된 코드만 예외로 매핑을 유지한다.
# 자세한 근거와 코드별 판정은 sic-residual-report.md 참고.
#
# 같은 날 이 규칙을 10개 코드에 한꺼번에 적용했다가(unmapped) 유니버스가 1,201 →
# 1,104로 줄고 GOOGL·META·DASH·AKAM·FISV를 포함한 97개사가 이탈해 산업 11개가 후보
# 3개 미만으로 떨어지는 것을 확인하고, 3577만 남기고 나머지 9개를 map으로 되돌렸다.
# "3577"은 등록기업 구성이 실제로 여러 업종에 흩어져 있어(unmapped 목록에 근거 있음)
# 그대로 두지만, 나머지 9개는 산업 순도보다 유니버스 폭을 우선한 제품 결정으로
# residual_reviewed 하단 "폭 우선(breadth-over-purity)" 절에 근거와 함께 복원했다.
# 자세한 측정은 sic-residual-narrowing-report.md 참고.
